server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ===== 安全响应头 =====
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # 隐藏版本号
    server_tokens off;

    # 禁止访问点文件（.git/.env 等），但放行 /.well-known/（JWKS 发现需要）
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # REST 反代到 backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JWKS 发现端点
    location = /.well-known/jwks.json {
        proxy_pass http://backend:8000/.well-known/jwks.json;
        proxy_http_version 1.1;
    }

    # WebSocket 反代
    location /api/ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # 静态资源缓存（带指纹的 js/css 可长缓存；此处不用 add_header，避免覆盖上方安全头的继承）
    location /assets/ {
        expires 30d;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 经营归因分析系统 · Docker Compose
# 独立 Docker 环境：顶层 name=bia → 容器/网络/卷均以 bia- 前缀隔离，不与其它项目共用。
# 当前启用：mysql / redis / backend（frontend 见 T10 同步落地后启用）。
# 资源约束：2C2G，backend 连接池/并发已按此收敛。

name: bia

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-bia}
      MYSQL_USER: ${DB_USER:-bia}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bia_password}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-prod}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-bia}
      DB_PASSWORD: ${DB_PASSWORD:-bia_password}
      DB_NAME: ${DB_NAME:-bia}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OIDC_ISSUER: http://backend:8000
      OIDC_CLIENT_ID: bia-web
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-change-me-client-secret}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8080/auth/callback}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      FLAG_SCENARIO_DATA: ${FLAG_SCENARIO_DATA:-true}
      FLAG_COMMAND_EXEC: ${FLAG_COMMAND_EXEC:-false}
      FLAG_ATTACHMENT: ${FLAG_ATTACHMENT:-true}
      FLAG_EXTERNAL_DS: ${FLAG_EXTERNAL_DS:-false}
      FLAG_RESULT_GENERATE: ${FLAG_RESULT_GENERATE:-false}
      WS_MAX_CONNECTIONS: 10
      TASK_CONCURRENCY_LIMIT: 3
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  # ===== T10：前端（Vue3 构建 + nginx 托管，/api 与 WS 反代到 backend）=====
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql_data:
